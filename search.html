  <header class="pv-header">
    <div class="pv-header-inner">
      <a href="index.html" class="pv-logo" aria-label="Privion Home">

          src="assets/images/logo/privion-logo.png"
          alt="privion"
          class="pv-logo-image"
        >

      <nav class="pv-nav" aria-label="Main Navigation">

        <div class="pv-search-box">

            placeholder="검색어를 입력하세요."
            autocomplete="off"
            aria-label="사이트 검색"

        </div>

        <div id="pv-search-results" class="pv-search-results">
          <p class="pv-search-empty">
            검색어를 입력하면 관련 페이지가 표시됩니다.
          </p>
        </div>
      </div>
    </section>

  <!-- FOOTER -->
  <footer class="pv-footer">
    <div class="pv-footer-inner">
      <div class="pv-footer-left">
        <a href="index.html" class="pv-logo" aria-label="Privion Home">

            alt="privion"
            class="pv-logo-image"
