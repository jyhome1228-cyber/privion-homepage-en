name: Localize English PR

on:
  pull_request_target:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  localize:
    if: ${{ github.event.pull_request.head.ref == 'english-conversion' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out English conversion branch
        uses: actions/checkout@v4
        with:
          ref: english-conversion
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install localization dependency
        run: npm install --no-save --no-package-lock cheerio@1.0.0

      - name: Generate static English pages
        run: node scripts/localize-static.js

      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html technology.html product.html product-dl100.html product-dl100s.html product-dl150.html product-dl150s.html application.html contact.html search.html terms.html privacy.html
          git commit -m "Generate static English pages [skip ci]"
          git push origin english-conversion
